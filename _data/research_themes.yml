# Research themes / areas
# id: used to tag publications in publications.yml (themes: [id1, id2])
# color: a `name` from poster_palette.yml. It colors the theme's card on Research and the poster of
#        every work whose first theme (in `themes` in publications.yml) is this one. A work's own
#        `poster_color` overrides it. Without a color, card N uses the Nth palette color (wrapping).
- id: uq-dpe
  color: dusty-blue
  title: "Uncertainty Quantification & Distribution Property Estimation"
  description: >
    Generative language models are not always accurate, and they struggle to reliably gauge their intrinsic uncertainty, motivating ancillary systems that do so on their behalf.
    My work often views this through the lens of distribution property estimation.

- id: model-behavior
  color: lilac
  title: "Model Behavior, Interpretability, & Evaluations"
  description: >
    Generative language models can behave in unexpected ways, for reasons that are notoriously opaque.
    Responsible deployment of machine learning systems warrants careful examination of such behavior and potential failure modes.

- id: health-applications
  color: sage
  title: "Data Science Applications: Health Sciences"
  description: >
    It has been suggested that <a href="https://www.rbccm.com/en/gib/healthcare/episode/the_healthcare_data_explosion">~30%</a> of all data generated is attributable to the healthcare sector.
    Public health and biomedical informatics are rich areas of application for natural language processing and network science.

- id: log-applications
  color: mist
  title: "Data Science Applications: Logistics & Engineering"
  description: >
    Through my experience at the <a href="https://www.lmisolutions.com/">Logistics Management Institute (LMI)</a>, I have had the opportunity to collaborate with industry practioners on practical problems involving technical language processing and simulation.