---
layout: default
---

<div class="page-wrapper">

  <div class="project-header">
    <div class="project-header__main">
      <div class="project-header__name">{{ page.title }}</div>
      <p class="project-header__desc">{{ page.number }} · {{ page.season }} {{ page.year }}</p>
    </div>
    {% if page.url_external != "" and page.url_external %}
    <div class="project-header__links">
      <a href="{{ page.url_external }}" class="project-header__link" target="_blank" rel="noopener">Course Site</a>
    </div>
    {% endif %}
  </div>

  <div class="section-header">
    <span class="section-title">Overview</span>
    <span class="section-rule"></span>
  </div>

  <div class="project-blurb">
    {{ content }}
  </div>

</div>
