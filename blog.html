---
layout: default
title: "Blog"
permalink: /blog/
nav_id: blog
---

<div class="page-wrapper">

  <div class="section-header">
    <span class="section-title">Blog</span>
    <span class="section-rule"></span>
  </div>

  <div class="blog-list">
    {% assign posts = site.blog | sort: "date" | reverse %}
    {% for post in posts %}
    <div class="blog-item">
      <span class="blog-item__date">{{ post.date | date: "%B %-d, %Y" }}</span>
      <a href="{{ post.url | relative_url }}" class="blog-item__title">{{ post.title }}</a>
      <p class="blog-item__desc">{{ post.summary }}</p>
    </div>
    {% endfor %}
  </div>

</div>
