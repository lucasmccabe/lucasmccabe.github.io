title: "Lucas H. McCabe"
description: "Personal website"
favicon: "🦑"  # emoji shown as the browser tab icon
url: "https://lucasmccabe.github.io"  # replace with your actual GitHub username
baseurl: ""

# Author / profile data
author:
  name: "Lucas H. McCabe"
  title: "PhD Candidate, Department of Computer Science, The George Washington University"
  department: "Data Science Fellow"
  university: >
    <a href="https://www.lmisolutions.com/">Logistics Management Institute (LMI)</a>
  # "Logistics Management Institute" #""
  email: "lucasmccabe@gwu.edu"
  photo: "assets/img/profile.png"
  bio: >
    The primary thrust of my research involves statistical and algorithmic aspects of trustworthiness in machine learning systems.
    My current focus pertains to generative language models, including uncertainty quantification and interpretability. 
    I am also interested in interdisciplinary applications of data and network science. 
    Please see my <a href="/research">research themes</a> and <a href="/works">works</a> for more.
    I am fortunate to be advised by <a href="https://www2.seas.gwu.edu/~howie/">Professor H. Howie Huang</a>.
  # How your name appears in author lists — all variants will be bolded
  aliases:
    - "McCabe, L. H."
    - "L. H. McCabe"
    - "McCabe, Lucas H."
    - "Lucas H. McCabe"

# Social links (set to "" to hide)
social:
  email: "lucasmccabe@gwu.edu"
  google_scholar: "https://scholar.google.com/citations?user=fXWneGkAAAAJ&hl"
  github: "https://github.com/lucasmccabe"
  twitter: ""
  linkedin: "https://linkedin.com/in/lucashurleymccabe"
  orcid: ""
  cv: "" #"assets/pdf/cv.pdf"

# Navigation
nav:
  - id: about
    title: "About"
    url: "/"
  - id: research
    title: "Research"
    url: "/research/"
  - id: works
    title: "Works"
    url: "/works/"
  - id: teaching
    title: "Teaching"
    url: "/teaching/"
  - id: open_source
    title: "Open Source"
    url: "/open-source/"
  - id: media
    title: "Media"
    url: "/media/"
  - id: blog
    title: "Blog"
    url: "/blog/"

# Which pages are active/deployed on the site. A page can be built out in
# nav above but kept off the live site by setting its flag to false here —
# useful for staging future pages before they're ready to publish.
active_pages:
  about: true
  research: true
  teaching: false
  works: true
  open_source: true
  media: false
  blog: false

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  courses:
    output: true
    permalink: /courses/:name/
  blog:
    output: true
    permalink: /blog/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: courses
    values:
      layout: course
  - scope:
      path: ""
      type: blog
    values:
      layout: blog-post

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  math_engine: mathjax

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - "*.sh"
