name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CV is not tracked in git; it is stored as an asset of the "cv" release.
      - name: Fetch CV from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/pdf
          gh release download cv -p cv.pdf -D assets/pdf --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::No 'cv' release with cv.pdf found; CV link will be broken."

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
