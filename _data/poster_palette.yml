# Publications and preprints
# Fields: title, authors, venue, venue_abbr (optional; shown on the poster instead of venue), year, type (journal/conference/preprint),
#         selected (true/false), url, pdf, doi, code, abstract
#         hide_glyph (optional; true = no dot-grid glyph on the poster)
#         themes: list of theme IDs from research_themes.yml; the first one sets the poster color
#                 (the theme's `color`); works without themes get a dealt color
#         poster_color (optional; a poster_palette.yml name; overrides the theme color)
# Link priority: url (HTML landing page) > pdf

